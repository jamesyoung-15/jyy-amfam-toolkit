[project]
name = "jyy-amfam-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "python-slugify>=8.0.4",
    "questionary>=2.1.1",
    "ruff>=0.16.0",
    "typer>=0.27.0",
]

[project.scripts]
jyy-amfam-toolkit = "jyy_amfam_toolkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
